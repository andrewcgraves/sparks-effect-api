name: CI

# Tags are deliberately not a trigger here: a release promotes an image this
# workflow already built and tested on `main`, and rebuilding it would defeat
# that. See `release.yml`.
on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  check:
    name: Test, lint, vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make itest` brings up a throwaway Postgres and RabbitMQ (via the same
      # Makefile targets used locally), runs the full suite with both sets of
      # integration tests enabled, then tears the containers down — DRY across
      # local and CI.
      #
      # CI is set on GitHub Actions, and the integration suites treat a missing
      # TEST_DATABASE_URL / TEST_AMQP_URL as a hard failure when it is present,
      # so a broken service here fails the job rather than silently skipping.
      - name: Test (with Postgres and RabbitMQ integration)
        run: make itest

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparks-effect-api
          path: bin/sparks-effect-api

  publish:
    name: Publish Docker image
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `sha-<commit>` is the promotable artifact: immutable, and what
          # `release.yml` re-tags as `:prd` when a release tag names this
          # commit. `staging` is a moving tag for whatever the trunk last
          # built. No `latest` — a moving tag something deploys from is how
          # production drifts with nobody choosing to move it.
          tags: |
            type=sha
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Staging is whatever `main` last published. Linear's staging pipeline is a
  # separate stream from production because the two environments can (and do)
  # hold different commits at the same time — see docs/releases.md.
  linear-staging:
    name: Record staging release in Linear
    needs: [check, build, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # linear-release-action scans commits since the last Linear release,
          # which needs the full history.
          fetch-depth: 0

      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step and
      # gates the action via an output, same idea as RAILWAY_TOKEN.
      - name: Check for the staging pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_STAGING: ${{ secrets.LINEAR_ACCESS_KEY_STAGING }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_STAGING:-}" ]]; then
            echo "::notice::LINEAR_ACCESS_KEY_STAGING is not set — create the 'API staging' pipeline in Linear and add its access key as this repository secret"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Linear staging release
        if: steps.linear.outputs.configured == 'true'
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_STAGING }}
          links: |
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Image=https://github.com/${{ github.repository }}/pkgs/container/sparks-effect-api
