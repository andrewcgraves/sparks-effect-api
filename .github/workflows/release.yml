name: Release

# Production is reached by tagging a commit, and by nothing else.
#
# The tag names a commit that is already on `main` and whose image `main`
# already built and staging already ran. This workflow never builds: it re-tags
# that image as `:prd` (and as the release tag itself) and asks Railway to pull
# it. A tag that does not point into `main`'s history is refused, so a feature
# branch has no path to production even if someone tags it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote, e.g. v1.4.2. Pass an older tag to roll back."
        required: true
        type: string
      base_ref:
        description: "Optional exclusive git ref for Linear's commit scan (e.g. v0.1.0). Leave empty to scan from the previous git tag."
        required: false
        type: string
      linear_only:
        description: "Skip image re-tag and Railway redeploy; only re-sync Linear for this tag."
        required: false
        type: boolean
        default: false

# Two promotions racing would leave `:prd` pointing at whichever re-tag landed
# last rather than whichever was asked for last.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote image to production
    runs-on: ubuntu-latest
    # Scopes the Railway credential to production and gives the repo one place
    # to require an approval before prd moves.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check below is what keeps a tag on a feature branch out
          # of production, and it needs the full history to answer.
          fetch-depth: 0

      - name: Resolve the tag and the commit it points at
        id: target
        env:
          # Empty on a tag push, in which case the pushed tag is the target.
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          if ! git fetch --force origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "::error::tag '$tag' does not exist"
            exit 1
          fi

          # rev-list dereferences an annotated tag to the commit it wraps; using
          # the ref directly would hand the tag object's own SHA to the checks.
          sha="$(git rev-list -n 1 "refs/tags/$tag")"

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$tag points at $sha, which is not on main — refusing to promote"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "short=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event.inputs.linear_only != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag that commit's image as prd
        if: github.event.inputs.linear_only != 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          SHORT: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail
          src="$IMAGE:sha-$SHORT"

          # Only `main` publishes, and it publishes only after the test, vet,
          # lint and build jobs pass — so this tag existing is the proof that
          # the commit went through the trunk green. Missing means it did not,
          # which is exactly what promotion must refuse.
          echo "Promoting $src as $TAG"
          docker buildx imagetools inspect "$src" > /dev/null

          # `:prd` is what Railway deploys; `:$TAG` is an immutable record of
          # what each release was, and what a rollback re-promotes.
          docker buildx imagetools create --tag "$IMAGE:prd" --tag "$IMAGE:$TAG" "$src"
          docker buildx imagetools inspect "$IMAGE:prd"

      # Moving the `:prd` tag does not by itself make Railway pull it, so the
      # promotion would sit unshipped until someone clicked redeploy. Skipped
      # with a notice when the credential is not set, rather than failing a
      # promotion that did in fact re-tag the image.
      - name: Redeploy the production Railway service
        if: github.event.inputs.linear_only != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::notice::RAILWAY_TOKEN is not set — image is tagged :prd, redeploy Railway by hand"
            exit 0
          fi

          npm install --global @railway/cli

          # A Railway project token is scoped to one environment, so the token
          # itself decides that this touches production and nothing else.
          if [[ -n "${RAILWAY_SERVICE:-}" ]]; then
            railway redeploy --service "$RAILWAY_SERVICE" --yes
          else
            railway redeploy --yes
          fi

      # Linear scans this working tree, so it must be the promoted commit —
      # not `main`. A tag push already checks out that SHA; workflow_dispatch
      # of an older tag would otherwise scan trunk HEAD and attach issues
      # that are not in the promoted image.
      - name: Check out the promoted commit
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: git checkout --detach "$SHA"

      # Production is a different Linear pipeline from staging: the same issue
      # can sit on staging for a while before a tag promotes it, and staging
      # can already be several commits ahead. See docs/releases.md.
      #
      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step.
      - name: Check for the production pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_PRODUCTION: ${{ secrets.LINEAR_ACCESS_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_PRODUCTION:-}" ]]; then
            echo "::notice::LINEAR_ACCESS_KEY_PRODUCTION is not set — create the 'API production' pipeline in Linear and add its access key as a secret on the production environment"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Operator base_ref wins. Otherwise the exclusive lower bound is the
      # previous vMAJOR.MINOR.PATCH tag, so a production release records every
      # issue since the last tag went to production — including when Linear
      # has no prior release SHA of its own. See docs/releases.md.
      #
      # Two Linear steps because `base_ref` has no "unset" value once written
      # — passing it empty would scan from nothing rather than letting Linear
      # pick its automatic baseline (the true first tag, with no previous git
      # tag to bound from).
      - name: Resolve Linear scan base
        id: scan
        env:
          OVERRIDE: ${{ github.event.inputs.base_ref }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ -n "${OVERRIDE:-}" ]]; then
            echo "base_ref=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            echo "Using dispatch base_ref ${OVERRIDE}"
            exit 0
          fi

          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${SHA}^" 2>/dev/null || true)"
          if [[ -n "$prev" ]]; then
            echo "base_ref=${prev}" >> "$GITHUB_OUTPUT"
            echo "Scanning from previous tag ${prev}"
          else
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "No previous tag — Linear will use its automatic baseline"
          fi

      - name: Sync Linear production release
        if: steps.linear.outputs.configured == 'true' && steps.scan.outputs.base_ref == ''
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_PRODUCTION }}
          name: ${{ steps.target.outputs.tag }}
          version: ${{ steps.target.outputs.tag }}
          links: |
            Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.target.outputs.sha }}
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Image=https://github.com/${{ github.repository }}/pkgs/container/sparks-effect-api

      - name: Sync Linear production release with explicit scan base
        if: steps.linear.outputs.configured == 'true' && steps.scan.outputs.base_ref != ''
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_PRODUCTION }}
          name: ${{ steps.target.outputs.tag }}
          version: ${{ steps.target.outputs.tag }}
          base_ref: ${{ steps.scan.outputs.base_ref }}
          links: |
            Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.target.outputs.sha }}
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Image=https://github.com/${{ github.repository }}/pkgs/container/sparks-effect-api

      - name: Summarise
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
          SHORT: ${{ steps.target.outputs.short }}
          LINEAR_ONLY: ${{ github.event.inputs.linear_only }}
          BASE_REF: ${{ steps.scan.outputs.base_ref }}
        run: |
          {
            if [[ "${LINEAR_ONLY:-}" == "true" ]]; then
              echo "### Recorded \`$TAG\` in Linear"
              echo
              echo "- commit: \`$SHA\`"
              echo "- image left alone: \`$IMAGE:sha-$SHORT\` (\`:prd\` not moved)"
            else
              echo "### Promoted \`$TAG\` to production"
              echo
              echo "- commit: \`$SHA\`"
              echo "- image: \`$IMAGE:sha-$SHORT\`"
              echo "- now also tagged: \`:prd\`, \`:$TAG\`"
            fi
            if [[ -n "${BASE_REF:-}" ]]; then
              echo "- Linear scan: \`${BASE_REF}..HEAD\`"
            else
              echo "- Linear scan: automatic baseline (no previous git tag)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
