# Station coordinates are the planned HSR stop locations per official CAHSR/Wikipedia sources.
# Source: Wikipedia station articles (citing CAHSR EIR/EIS filings, CEQA notices, and
# official CAHSR Business Plan station maps). Coordinates cross-checked against
# CEQA project notices (e.g. 36°56′11″N 119°59′11″W for Madera per ceqanet.lci.ca.gov/2023110616)
# and Wikipedia infobox coordinates for each station.
# Phase 1 stations (SF–Anaheim) and the Brightline West spur stations (Victor Valley,
# Las Vegas) are all active; the spur joins Phase 1 at the shared Palmdale stop.
