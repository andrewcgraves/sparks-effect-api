# Adjacent segment run times (train in motion only — dwell is added at compile time).
# Source: CA HSR 2026 Business Plan all-stop travel-time matrix — Service Planning
# Methodology technical report, pp. 17, 20, 24-25
# (https://hsr.ca.gov/wp-content/uploads/2026/06/26BP-Service-Planning-Tech-Report-A11Y.pdf).
# The matrix itself is committed as internal/transit/testdata/ca-hsr-2026bp-all-stop-minutes.csv,
# and TestSeededCAHSRMatchesBusinessPlanMatrix holds the compiled graph to it.
#
# ## Topology
#
# Phase 1 runs SF → Millbrae → San Jose → Gilroy → Madera → Fresno → … →
# Anaheim. Merced is not on it: it sits up a stub off the Central Valley Wye,
# joined to the corridor by its own merced ↔ madera segment on the Merced spur
# route. The matrix is unambiguous about this — SF → Fresno (124 min) is faster
# than SF → Merced (136), and Gilroy → Madera is 33 against Gilroy → Merced's
# 56 — and treating Merced as a through stop between Gilroy and Madera, as this
# file used to, made every Bay Area ↔ Central Valley time ~35 min slow and every
# Merced-southward time up to 43 min fast (SPA-364).
#
# ## Derivation
#
# The run times below are a least-squares fit, not the matrix's adjacent cells.
# A compiled origin–destination time is the sum of its hops' run seconds plus
# 90 s of resolved dwell per hop (Siemens Venture, level boarding); the fit
# chooses run seconds that minimise the squared error of that sum against every
# matrix pair among the Phase 1 stations and Merced (156 pairs), then rounds to
# 10 s. Taking the adjacent cells directly does badly — they are close to
# run-only, while the multi-stop cells add 1.5–2.5 min per intermediate stop, so
# summing them loses up to 29 min over a long trip (RMS 12 min). The fit lands
# every pair within 5.2 min (RMS 2.1 min); San Jose → Fresno compiles to 67.7
# against 65, Fresno → San Jose to 70.5 against 70, and SF → Anaheim to 304.5
# against 306.
#
# A hop carries reverse_run_seconds where the fitted directions differ by a
# minute or more, because the matrix is not symmetric. Gilroy ↔ Madera (Pacheco
# Pass) and Bakersfield ↔ Palmdale (Tehachapi) are the grades you would expect;
# San Jose ↔ Gilroy and Merced ↔ Madera are the matrix's own asymmetry, kept
# rather than averaged away. Everything else is fitted as one number for both
# directions.
#
# The Brightline West spur is not fitted and keeps its run-only estimates. The
# matrix's Brightline ↔ Phase 1 cells include a connection at Palmdale of
# roughly 16-20 min (Victorville → Burbank 86 against 19 + 46), and the graph
# charges nothing to change trains — there is no transfer edge — so no choice of
# run times could reproduce them.
#
# Arrival isochrones ("everywhere that can reach here") are not equivalent to
# departure isochrones ("everywhere reachable from here"). Do not reuse the
# departure computation from the destination.
#
# Segments are ordered in the primary service direction (SF → Anaheim for Phase 1,
# Merced → Madera for the spur, Palmdale → Las Vegas for the Brightline West
# spur, which branches at Palmdale).
#
# Multi-hop origin–destination times are derived by summing consecutive segments in code
# (see Store.TravelTimeBetween). This replaces the full NxN matrix; callers do not store
# computed OD times — the store sums on demand.
#
# Station slugs match stations.yaml slug values; route_id matches routes.yaml ids.
# route_id is the corridor a span is track of — Express and Local share Phase 1,
# so the route, not the service, is what a segment belongs to.

scenario_slug: "ca-hsr"
provenance: calibrated
source: "2026 Business Plan Service Planning Methodology all-stop travel-time matrix (pp. 17, 20, 24-25), least-squares fit over Phase 1 + Merced pairs"
segments:
