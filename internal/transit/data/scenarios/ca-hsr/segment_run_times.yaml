# Adjacent segment run times (train in motion only — dwell is added at compile time).
# Source: CA HSR 2026 Business Plan all-stop travel-time matrix — Service Planning
# Methodology technical report, pp. 17, 20, 24-25
# (https://hsr.ca.gov/wp-content/uploads/2026/06/26BP-Service-Planning-Tech-Report-A11Y.pdf).
# The matrix itself is committed as internal/transit/testdata/ca-hsr-2026bp-all-stop-minutes.csv,
# and TestSeededCAHSRMatchesBusinessPlanMatrix holds the compiled graph to it.
#
# ## Derivation (SPA-364)
#
# The run times are a least-squares fit to the matrix, not its adjacent cells.
# A compiled origin–destination time is the sum of its hops' run seconds plus
# 90 s of resolved dwell per hop (Siemens Venture, level boarding); the fit
# picks run seconds that minimise the squared error of that sum against every
# matrix pair among the Phase 1 stations (156 pairs), then rounds to 10 s.
# The adjacent cells cannot be used directly: they are close to run-only, while
# the multi-stop cells add 1.5–2.5 min per intermediate stop, so summing them
# drifts by up to half an hour over a long trip.
#
# This replaces an earlier derivation that stripped ~90 s of dwell from each
# cell and scaled every hop by 16/17 to land SF → Anaheim on exactly 306 min.
# That matched the one end-to-end figure and little else: San Jose → Fresno
# compiled to 99.5 min against the matrix's 65.
#
# ## Merced is on the line, and the matrix does not agree
#
# Every Phase 1 service here calls at Merced between Gilroy and Madera, so any
# trip across it passes through. The matrix does not treat Merced that way —
# it has San Jose → Fresno (65) faster than San Jose → Merced (78), and
# SF → Fresno (124) faster than SF → Merced (136), which no set of times on a
# single line can reproduce. The fit therefore splits the difference: pairs
# that do not touch Merced land within 8.5 min (RMS 3.1 min; San Jose → Fresno
# 71.5, Fresno → San Jose 74.2, SF → Anaheim 308.3), and trips to or from
# Merced northward come out up to 30 min faster than the matrix. That is the
# price of keeping Merced a through stop; the test states both tolerances.
#
# A hop carries reverse_run_seconds where the fitted directions differ by a
# minute or more, because the matrix is not symmetric. Bakersfield ↔ Palmdale
# (Tehachapi) is the grade you would expect; San Jose ↔ Gilroy and
# Merced ↔ Madera are the matrix's own asymmetry.
#
# The Brightline West spur is not fitted and keeps its run-only estimates. The
# matrix's Brightline ↔ Phase 1 cells include a connection at Palmdale of
# roughly 16-20 min (Victorville → Burbank 86 against 19 + 46), and the graph
# charges nothing to change trains — there is no transfer edge — so no choice of
# run times could reproduce them.
#
# Arrival isochrones ("everywhere that can reach here") are not equivalent to
# departure isochrones ("everywhere reachable from here"). Do not reuse the
# departure computation from the destination.
#
# Segments are ordered in the primary service direction (SF → Anaheim for Phase 1,
# Palmdale → Las Vegas for the Brightline West spur, which branches at Palmdale).
#
# Multi-hop origin–destination times are derived by summing consecutive segments in code
# (see Store.TravelTimeBetween). This replaces the full NxN matrix; callers do not store
# computed OD times — the store sums on demand.
#
# Station slugs match stations.yaml slug values; route_id matches routes.yaml ids.
# route_id is the corridor a span is track of — Express and Local share Phase 1,
# so the route, not the service, is what a segment belongs to.

scenario_slug: "ca-hsr"
provenance: calibrated
source: "2026 Business Plan Service Planning Methodology all-stop travel-time matrix (pp. 17, 20, 24-25), least-squares fit over Phase 1 pairs"
segments:
