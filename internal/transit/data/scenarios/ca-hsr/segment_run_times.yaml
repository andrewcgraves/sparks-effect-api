# Adjacent segment run times (train in motion only — dwell is added at compile time).
# Source: CA HSR 2026 Business Plan travel-time matrix
# (https://hsr.ca.gov/communications-outreach/reports/business-plans/2026-business-plan/).
#
# These integers are a directed path-sum fit to Table 3-4 (all-stop), not the raw
# adjacent cells. The matrix is not hop-additive: the southbound adjacent cells
# sum to 281 min while SF→Anaheim is 306. Each compiled hop below already includes
# one 90 s level-boarding dwell, so run_seconds = minutes*60 - 90, and
# reverse_run_seconds is the other direction the same way, omitted when the two
# Table 3-4 directions are equal.
#
# reverse_run_seconds is set on every hop whose two Table 3-4 directions differ,
# not only the two mountain hops.
#
# The old 16/17 scale forced the published 306-minute SF→Anaheim total while the
# alignment still ran the Merced detour. That made everything north of Merced
# about 30 min slow and everything south of it too fast. Do not reintroduce
# that scale.
#
# Corridor totals (11 Phase 1 hops × 90 s dwell):
#   SF→Anaheim compiled 18300 s = 305 min (matrix 306)
#   Anaheim→SF compiled 18180 s = 303 min (matrix 306)
#   San Jose→Fresno 66 min (matrix 65)
#   Fresno→San Jose 70 min (matrix 70)
#
# The Merced spur is 23 min forward / 25 min reverse, not the Table 3-4 direct
# cell of 20 and not the Table 3-1 M–B cell of 17. Footnote 7 says Merced trip
# times include a Madera transfer, and the Merced rows are not a constant offset
# from Madera (about +18 min toward the Bay Area and about +29 min toward
# Anaheim). The graph has no transfer edge (CONTEXT.md): a path that arrives on
# one service and leaves on another passes through the shared node and pays
# nothing extra. 23 forward / 25 reverse is the pair that keeps every
# Merced↔Phase 1 compiled time within 6 min of Table 3-4.
#
# Arrival isochrones ("everywhere that can reach here") are no longer equivalent
# to departure isochrones ("everywhere reachable from here"). Do not reuse the
# departure computation from the destination.
#
# Segments are ordered in the primary service direction (SF → Anaheim for Phase 1,
# Merced → Madera for the Merced spur, Palmdale → Las Vegas for the Brightline
# West spur, which branches at Palmdale).
#
# Multi-hop origin–destination times are derived by summing consecutive segments in code
# (see Store.TravelTimeBetween). This replaces the full NxN matrix; callers do not store
# computed OD times — the store sums on demand.
#
# Station slugs match stations.yaml slug values; route_id matches routes.yaml ids.
# route_id is the corridor a span is track of — Express and Local share Phase 1,
# so the route, not the service, is what a segment belongs to.

scenario_slug: "ca-hsr"
provenance: calibrated
source: "2026 Business Plan Service Planning Methodology, Table 3-4 (all-stop; directed path-sum fit, SF→Anaheim matrix 306 min)"
