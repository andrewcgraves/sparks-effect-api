# Services for the CA HSR scenario.
#
# HSR Express: key stops only (skips Madera and Kings/Tulare). Parked — see
#   `active` on its entry below.
# HSR Local: all Phase 1 stops SF–Anaheim.
# Brightline West: Palmdale–Victor Valley–Las Vegas spur, interchanging with Phase 1 at Palmdale.
#
# Frequency windows are representative of the 2026 Business Plan peak/off-peak headways.
# HeadwayS 1800 = every 30 min (peak), 3600 = every 60 min (off-peak).

- id: "00000000-0000-4004-8001-000000000001"
  scenario_id: "00000000-0000-4001-8001-000000000001"
  route_id: "00000000-0000-4002-8001-000000000001"
  vehicle_type_id: "00000000-0000-4003-8001-000000000001"
  name: "HSR Express"
  direction: "both"
  # Parked. Phase 1 is one corridor, and running two stopping patterns over it
  # makes the network read as two lines everywhere it is presented — an
  # isochrone reports the same station twice, once per pattern, and the rider
  # has to work out that they are the same railway. Kept here rather than
  # deleted: nothing about the pattern is wrong, it is the presentation that
  # cannot yet carry it. Setting this back to true restores it to both the
  # compiled graph and the scenario API.
  active: false
  provenance: calibrated
  stops:
    - station_id: "00000000-0000-4005-8001-000000000001"
      sequence: 1
    - station_id: "00000000-0000-4005-8001-000000000002"
      sequence: 2
    - station_id: "00000000-0000-4005-8001-000000000003"
      sequence: 3
    - station_id: "00000000-0000-4005-8001-000000000004"
      sequence: 4
    - station_id: "00000000-0000-4005-8001-000000000005"
      sequence: 5
    - station_id: "00000000-0000-4005-8001-000000000007"
      sequence: 6
    - station_id: "00000000-0000-4005-8001-000000000009"
      sequence: 7
    - station_id: "00000000-0000-4005-8001-00000000000a"
      sequence: 8
    - station_id: "00000000-0000-4005-8001-00000000000c"
      sequence: 9
    - station_id: "00000000-0000-4005-8001-00000000000d"
      sequence: 10
    - station_id: "00000000-0000-4005-8001-00000000000e"
      sequence: 11
  frequency_windows:
    - start_time: "06:00"
      end_time: "09:00"
      headway_s: 1800
    - start_time: "09:00"
      end_time: "22:00"
      headway_s: 3600

