description: |-
  Do you have a free afternoon? Or just 45 minutes? This map shows how far you can get using California high-speed rail. Choose your starting place, and the colored-in area is everywhere you can get in the time you have. Whether you're bringing your bicycle or riding public transit to the train station, high-speed rail will connect you to a whole new California.

  This map shows phase 1 of California's high-speed rail network, plus the High Desert Corridor and Brightline West. Service between Merced and Bakersfield is expected to start in 2033 and the full San Francisco to Southern California project is on track to be finished in 2040.

  Want to see it built faster? Move California, with Transbay Coalition and Move LA, is petitioning the Governor and state lawmakers to remove the political barriers slowing the project down: have utilities move their equipment out of the line's way, let private investors help pay for the next phases, and have highway agencies share the cost of the roads around it. [Sign the petition](https://actionnetwork.org/petitions/build-the-california-high-speed-rail-sooner-2).

  Notes:

  The map for a single travel time includes both local and express trains, assuming you will take whichever is fastest for a given destination. Travel times do not include transfer times for buses and other public transit. Data for this map was drawn from the California High-Speed Rail Authority's statewide HSR dataset (CAHSR PDS Engineering), OpenStreetMap (© OpenStreetMap contributors, ODbL), High Desert Corridor Joint Powers Agency maps, California Environmental Impact Reports, and Wikipedia.
